general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

# Blank the displays after an hour. Backlights have a finite life
# (~30-50k hours) and this machine is meant to stay powered on, so the
# panels should not sit lit overnight. Any input wakes them.
#
# No auto-lock: locking is manual via Super+L.
#
# Note the dispatch syntax. Under Hyprland's Lua config, the old
# `hyprctl dispatch dpms off` form is a Lua parse error and silently does
# nothing, so the screens stayed lit all night. The string form
# `hl.dsp.dpms("on")` parses but turns displays *off* regardless of the
# argument; only the table form with an explicit state behaves correctly.
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ state = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ state = "on" })'
}

# No suspend listener on purpose: suspending is how an always-on machine
# silently drops off the network.
