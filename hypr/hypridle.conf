general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Blank the displays after 10 minutes. Backlights have a finite life
# (~30-50k hours) and this machine is meant to stay powered on, so the
# panels should not sit lit while nobody is here.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# No suspend listener on purpose: suspending is how an always-on machine
# silently drops off the network.
