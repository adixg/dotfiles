general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Blank the displays after an hour. Backlights have a finite life
# (~30-50k hours) and this machine is meant to stay powered on, so the
# panels should not sit lit overnight. Any input wakes them.
#
# No auto-lock: locking is manual via Super+L.
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# No suspend listener on purpose: suspending is how an always-on machine
# silently drops off the network.
