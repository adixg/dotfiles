# Advertise truecolour to programs running inside tmux.
#
# default-terminal is xterm-256color rather than the usual tmux-256color
# because tmux-256color's terminfo lacks the "ccc" (can_change_color)
# capability. cava checks exactly that via ncurses and, since its gradient is
# defined in hex (#8bd5ca ...), refuses to start rather than falling back:
#   "Your terminal can not change color definitions, please use one of the
#    predefined colors."
# The pane then dies instantly with status 1.
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 10000

# Windows and panes from 1, so the numbering matches the keyboard.
set -g base-index 1
setw -g pane-base-index 1

# Catppuccin Macchiato, matching waybar/hyprlock/kitty. Without this tmux
# uses its stock theme - a bright green status bar and plain white pane
# borders - which is the "termux green" that stands out against everything
# else here.
mch_base="#24273a"
mch_text="#cad3f5"
mch_subtext="#a5adcb"
mch_overlay="#6e738d"
mch_mauve="#c6a0f6"
mch_blue="#8aadf4"
mch_teal="#8bd5ca"

set -g status-style "bg=${mch_base},fg=${mch_text}"
set -g status-left-length 20
set -g status-right-length 60
set -g status-left "#[fg=${mch_base},bg=${mch_mauve},bold] #S #[fg=${mch_mauve},bg=${mch_base}]"
set -g status-right "#[fg=${mch_teal},bg=${mch_base}]#[fg=${mch_base},bg=${mch_teal}] %H:%M #[fg=${mch_base},bg=${mch_teal},bold] #h "

setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=${mch_overlay},bg=${mch_base}"
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=${mch_base},bg=${mch_blue},bold"

set -g pane-border-style "fg=${mch_overlay}"
set -g pane-active-border-style "fg=${mch_mauve}"

set -g message-style "fg=${mch_text},bg=${mch_base},bold"
